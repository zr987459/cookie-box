name: Build CookieBox APK

on:
  push:
    branches: [ "main", "master", "ui-1.6" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: WCAG AAA Contrast Gate
        run: python3 scripts/check_contrast.py

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CookieBox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # 手机上 Artifacts 需要登录且是 zip，不好下载；同时发布到 Releases，直接点 APK 即可下载
      - name: Publish APK to Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CookieBox 构建 #${{ github.run_number }}（${{ github.ref_name }}）
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' && github.ref_name != 'master' }}
          files: app/build/outputs/apk/debug/*.apk
          body: 由 GitHub Actions 自动构建。手机上点下面 Assets 里的 .apk 文件即可下载安装。
